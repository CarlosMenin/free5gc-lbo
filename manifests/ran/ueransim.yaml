# UERANSIM: emulated gNB and UE in a single pod, plus a sidecar that runs the
# traffic probe from inside the PDU session. See docs/07-ran-and-subscribers.md.
#
# Apply this manifest only after the subscribers are provisioned.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ueransim-config
  namespace: free5gc
data:
  # @POD_IP@ is replaced at start-up: UERANSIM does not expand environment
  # variables in its configuration files.
  gnb.yaml: |
    mcc: '208'
    mnc: '93'

    nci: '0x000000010'
    idLength: 32
    # Must match supportTaiList in the AMF configuration.
    tac: 1

    # gNB and UE share the pod network namespace: the radio link stays on loopback.
    linkIp: 127.0.0.1
    ngapIp: '@POD_IP@'
    gtpIp: '@POD_IP@'

    amfConfigs:
      - address: amf.free5gc.svc.cluster.local
        port: 38412
    slices:
      - sst: 0x1
        sd: 0x010203

    ignoreStreamIds: true

  ue.yaml: |
    # First IMSI; must match the provisioned subscribers and the members of
    # the UE routing file.
    supi: 'imsi-208930000000000'
    mcc: '208'
    mnc: '93'
    protectionScheme: 0
    homeNetworkPublicKey: '5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650'
    homeNetworkPublicKeyId: 1
    routingIndicator: '0000'

    # Same credentials written by scripts/provision-subscribers.py.
    key: '8baf473f2f8fd09487cccbd7097c6862'
    op: '8e27b6af0e692e750f32667a3b14605d'
    opType: 'OPC'
    amf: '8000'
    imei: '356938035643803'
    imeiSv: '4370816125816151'

    tunNetmask: '255.255.255.0'

    # Must be false: the tunnel interface has to be visible to the probe sidecar.
    useNamespace: false

    gnbSearchList:
      - 127.0.0.1

    uacAic:
      mps: false
      mcs: false
    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false

    sessions:
      - type: 'IPv4'
        apn: 'internet'
        slice:
          sst: 0x01
          sd: 0x010203

    configured-nssai:
      - sst: 0x01
        sd: 0x010203
    default-nssai:
      - sst: 1
        sd: 1

    integrity:
      IA1: true
      IA2: true
      IA3: true
    ciphering:
      EA1: true
      EA2: true
      EA3: true
    integrityMaxRate:
      uplink: 'full'
      downlink: 'full'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: free5gc-ueransim
  namespace: free5gc
  labels:
    epc-mode: ueransim
spec:
  serviceName: ueransim
  replicas: 1
  selector:
    matchLabels:
      epc-mode: ueransim
  template:
    metadata:
      labels:
        epc-mode: ueransim
        app: free5gc-ueransim
    spec:
      nodeSelector:
        # Edge site, but not the edge node itself (docs/02, section 2.4).
        kubernetes.io/hostname: CHANGE-ME-ran-node
      volumes:
        - name: ueransim-config
          configMap:
            name: ueransim-config
        # The ConfigMap is read-only; the rendered files are written here.
        - name: ueransim-run
          emptyDir: {}
        - name: probe
          configMap:
            name: lbo-probe
      containers:
        # gNB: N2 (NGAP over SCTP) towards the AMF, N3 (GTP-U) towards the UPF.
        - name: gnb
          image: free5gc/ueransim:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              sed "s/@POD_IP@/${POD_IP}/g" /config/gnb.yaml > /run/ueransim/gnb.yaml
              echo "[gnb] ngapIp/gtpIp = ${POD_IP}"
              exec ./nr-gnb -c /run/ueransim/gnb.yaml
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: ueransim-config
              mountPath: /config
            - name: ueransim-run
              mountPath: /run/ueransim
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
        # UE: creates the tunnel interface (uesimtun0) in the pod network
        # namespace. NUM_UE > 1 registers sequential IMSIs starting at the
        # supi of ue.yaml (uesimtun0, uesimtun1, ...).
        - name: ue
          image: free5gc/ueransim:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp /config/ue.yaml /run/ueransim/ue.yaml
              # The gNB must be up before the UE attempts to register.
              until [ -f /run/ueransim/gnb.yaml ]; do sleep 1; done
              sleep 5
              exec ./nr-ue -c /run/ueransim/ue.yaml -n "${NUM_UE}"
          env:
            - name: NUM_UE
              value: "1"
          volumeMounts:
            - name: ueransim-config
              mountPath: /config
            - name: ueransim-run
              mountPath: /run/ueransim
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
        # Probe client. It shares the pod network namespace, so it can bind to
        # the address of the PDU session. It idles; traffic is started with
        # "kubectl exec" (scripts/verify-lbo.py).
        - name: probe
          image: python:3.12-slim
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: probe
              mountPath: /opt/probe
              readOnly: true
