# Optional: scrape configuration for the Prometheus Operator. Apply only where
# its CRDs are installed. The label "release: prometheus" must match the
# serviceMonitorSelector of the cluster. See docs/11-extensions.md, section 11.6.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: free5gc-nrf
  namespace: free5gc
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: free5gc-nrf
  endpoints:
    - interval: 15s
      port: metrics-9091
      path: /metrics
---
