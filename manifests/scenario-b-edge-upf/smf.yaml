# Scenario B: SMF with the Uplink Classifier (ULCL) enabled.
#
#   gNB1 --N3--> I-UPF (edge) --N9--> PSA-UPF (core) --N6--> remote services
#                   |
#                   +--N6--> edge service (local breakout)
#
# See docs/05-ulcl-configuration.md for a field-by-field description.
apiVersion: v1
kind: ConfigMap
metadata:
  name: smf-config
  namespace: free5gc
data:
  smfConfig.yaml: |
    info:
      version: 1.0.7
      description: SMF - scenario B (edge UPF with ULCL / local breakout)

    configuration:
      smfName: SMF
      sbi:
        scheme: http
        registerIPv4: smf.free5gc.svc.cluster.local
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          key: cert/smf.key
          pem: cert/smf.pem
      serviceNameList:
        - nsmf-pdusession
        - nsmf-event-exposure
        - nsmf-oam
        - nsmf-callback
      snssaiInfos:
        - sNssai:
            sst: 1
            sd: 010203
          dnnInfos:
            - dnn: internet
              # DNAI of the edge domain (docs/05, section 5.2).
              dnaiList:
                - mec
              # Cluster DNS address handed to the UE; adjust to the cluster.
              dns:
                ipv4: 10.96.0.10
                ipv6: 2001:4860:4860::8888
        - sNssai:
            sst: 1
            sd: 112233
          dnnInfos:
            - dnn: internet
              dnaiList:
                - mec
              dns:
                ipv4: 10.96.0.10
                ipv6: 2001:4860:4860::8888
      plmnList:
        - mcc: 208
          mnc: 93
      locality: area1
      pfcp:
        nodeID: smf.free5gc.svc.cluster.local
        listenAddr: 0.0.0.0
        externalAddr: smf.free5gc.svc.cluster.local
        heartbeatInterval: 5s
      userplaneInformation:
        upNodes:
          gNB1:
            type: AN
          I-UPF:
            type: UPF
            nodeID: i-upf.free5gc.svc.cluster.local
            addr: i-upf.free5gc.svc.cluster.local
            # No "pools": the branching point does not allocate UE addresses.
            # The dnaiList is what makes this UPF selectable for the breakout.
            sNssaiUpfInfos:
              - sNssai:
                  sst: 1
                  sd: 010203
                dnnUpfInfoList:
                  - dnn: internet
                    dnaiList:
                      - mec
              - sNssai:
                  sst: 1
                  sd: 112233
                dnnUpfInfoList:
                  - dnn: internet
                    dnaiList:
                      - mec
            # Endpoints are sent to the peers in the F-TEID: they must be routable.
            interfaces:
              - interfaceType: N3
                endpoints:
                  - i-upf.free5gc.svc.cluster.local
                networkInstances:
                  - internet
              - interfaceType: N9
                endpoints:
                  - i-upf.free5gc.svc.cluster.local
                networkInstances:
                  - internet
          PSA-UPF:
            type: UPF
            nodeID: psa-upf.free5gc.svc.cluster.local
            addr: psa-upf.free5gc.svc.cluster.local
            # UE pools must not overlap across slices (docs/05, section 5.3).
            sNssaiUpfInfos:
              - sNssai:
                  sst: 1
                  sd: 010203
                dnnUpfInfoList:
                  - dnn: internet
                    pools:
                      - cidr: 60.60.0.0/17
              - sNssai:
                  sst: 1
                  sd: 112233
                dnnUpfInfoList:
                  - dnn: internet
                    pools:
                      - cidr: 60.60.128.0/17
            interfaces:
              - interfaceType: N9
                endpoints:
                  - psa-upf.free5gc.svc.cluster.local
                networkInstances:
                  - internet
        # The order of the links is significant (docs/05, section 5.4).
        links:
          - A: gNB1
            B: I-UPF
          - A: I-UPF
            B: PSA-UPF
      t3591:
        enable: true
        expireTime: 16s
        maxRetryTimes: 3
      t3592:
        enable: true
        expireTime: 16s
        maxRetryTimes: 3
      nrfUri: http://nrf.free5gc.svc.cluster.local:8000
      # Usage reporting thresholds raised on purpose (docs/04, section 4.6).
      urrPeriod: 3600
      urrThreshold: 1000000000
      requestedUnit: 1000000000

      # Enables the Uplink Classifier. Without it the UE routing file is ignored.
      ulcl: true

      metrics:
        enable: true
        scheme: http
        bindingIPv4: 0.0.0.0
        port: 9091
        namespace: free5gc

    logger:
      enable: true
      level: info
      reportCaller: false
---
# UE routing: subscribers handled by the ULCL and their default path.
# To change the number of subscribers: scripts/gen-uerouting.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ue-routing-info
  namespace: free5gc
data:
  ueRouting.yaml: |
    info:
      version: 1.0.7
      description: UE routing - local breakout through the ULCL

    ueRoutingInfo:
      UE1:
        # Subscribers to which this group applies.
        members:
          - imsi-208930000000000
          - imsi-208930000000001
          - imsi-208930000000002
          - imsi-208930000000003
          - imsi-208930000000004
        # Default path of the group, up to the anchor.
        topology:
          - A: gNB1
            B: I-UPF
          - A: I-UPF
            B: PSA-UPF
        # The breakout rule is delivered at runtime through Traffic Influence
        # (docs/06). Static alternative, read only at boot (docs/05, section 5.7):
        # specificPath:
        #   - dest: 10.96.100.100/32
        #     path: [I-UPF]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-smf
  namespace: free5gc
  labels:
    epc-mode: smf
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: smf
  template:
    metadata:
      labels:
        epc-mode: smf
        app: free5gc-smf
        version: v4.2.3
    spec:
      hostname: smf-pod
      nodeSelector:
        # Replace with the hostname of the core node (docs/02, section 2.4).
        kubernetes.io/hostname: CHANGE-ME-core-node
      containers:
        - name: smf
          image: free5gc/smf:v4.2.3
          imagePullPolicy: IfNotPresent
          # -u points to the UE routing file; it is mandatory.
          command: ["./smf", "-c", "/etc/free5gc/smfConfig.yaml", "-u", "/free5gc/ue/ueRouting.yaml"]
          env:
            - name: GIN_MODE
              value: release
          ports:
            - name: http2-8000
              protocol: TCP
              containerPort: 8000
            - name: udp-8805
              protocol: UDP
              containerPort: 8805
            - name: metrics-9091
              protocol: TCP
              containerPort: 9091
          volumeMounts:
            - name: config-volume
              mountPath: /etc/free5gc
            - name: config-uerouting
              mountPath: /free5gc/ue
      volumes:
        - name: config-volume
          configMap:
            name: smf-config
            defaultMode: 0777
        - name: config-uerouting
          configMap:
            name: ue-routing-info
---
apiVersion: v1
kind: Service
metadata:
  name: smf
  namespace: free5gc
  labels:
    app: free5gc-smf
spec:
  selector:
    epc-mode: smf
    app: free5gc-smf
  ports:
    - name: http2-8000
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: udp-8805
      protocol: UDP
      port: 8805
      targetPort: 8805
    - name: metrics-9091
      protocol: TCP
      port: 9091
      targetPort: 9091
