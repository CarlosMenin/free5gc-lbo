# NSSF: slice selection. See docs/03-control-plane.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nssf-config
  namespace: free5gc
data:
  nssfConfig.yaml: |
    info:
      version: 1.0.2
      description: NSSF initial local configuration

    configuration:
      nssfName: NSSF
      sbi:
        scheme: http
        registerIPv4: nssf.free5gc.svc.cluster.local
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          pem: cert/nssf.pem
          key: cert/nssf.key
      serviceNameList:
        - nnssf-nsselection
        - nnssf-nssaiavailability
      nrfUri: http://nrf.free5gc.svc.cluster.local:8000
      supportedPlmnList:
        - mcc: 208
          mnc: 93
      supportedNssaiInPlmnList:
        - plmnId:
            mcc: 208
            mnc: 93
          supportedSnssaiList:
            - sst: 1
              sd: 010203
            - sst: 1
              sd: 112233
      nsiList:
        - snssai:
            sst: 1
          nsiInformationList:
            - nrfId: http://nrf.free5gc.svc.cluster.local:8000/nnrf-nfm/v1/nf-instances
              nsiId: 10
        - snssai:
            sst: 1
            sd: 010203
          nsiInformationList:
            - nrfId: http://nrf.free5gc.svc.cluster.local:8000/nnrf-nfm/v1/nf-instances
              nsiId: 22
        - snssai:
            sst: 1
            sd: 112233
          nsiInformationList:
            - nrfId: http://nrf.free5gc.svc.cluster.local:8000/nnrf-nfm/v1/nf-instances
              nsiId: 23
      amfSetList:
        - amfSetId: 1
          nrfAmfSet: http://nrf.free5gc.svc.cluster.local:8000/nnrf-nfm/v1/nf-instances
          supportedNssaiAvailabilityData:
            - tai:
                plmnId:
                  mcc: 208
                  mnc: 93
                tac: 000001
              supportedSnssaiList:
                - sst: 1
                  sd: 010203
                - sst: 1
                  sd: 112233
      taList:
        - tai:
            plmnId:
              mcc: 208
              mnc: 93
            tac: 000001
          accessType: 3GPP_ACCESS
          supportedSnssaiList:
            - sst: 1
              sd: 010203
            - sst: 1
              sd: 112233

      metrics:
        enable: true
        scheme: http
        bindingIPv4: 0.0.0.0
        port: 9091
        namespace: free5gc

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-nssf
  namespace: free5gc
  labels:
    epc-mode: nssf
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: nssf
  template:
    metadata:
      labels:
        epc-mode: nssf
        app: free5gc-nssf
        version: v4.2.3
    spec:
      hostname: nssf-pod
      nodeSelector:
        # Replace with the hostname of the core node (docs/02, section 2.4).
        kubernetes.io/hostname: CHANGE-ME-core-node
      containers:
        - name: nssf
          image: free5gc/nssf:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["./nssf", "-c", "/etc/free5gc/nssfConfig.yaml"]
          env:
            - name: GIN_MODE
              value: release
          ports:
            - name: http2-8000
              protocol: TCP
              containerPort: 8000
            - name: metrics-9091
              protocol: TCP
              containerPort: 9091
          volumeMounts:
            - name: config-volume
              mountPath: /etc/free5gc
      volumes:
        - name: config-volume
          configMap:
            name: nssf-config
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: nssf
  namespace: free5gc
  labels:
    app: free5gc-nssf
spec:
  selector:
    epc-mode: nssf
    app: free5gc-nssf
  ports:
    - name: http2-8000
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: metrics-9091
      protocol: TCP
      port: 9091
      targetPort: 9091
