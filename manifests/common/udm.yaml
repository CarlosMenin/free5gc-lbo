# UDM: subscription data management. See docs/03-control-plane.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: udm-config
  namespace: free5gc
data:
  udmConfig.yaml: |
    info:
      version: 1.0.3
      description: UDM initial local configuration
    configuration:
      serviceNameList:
        - nudm-sdm
        - nudm-uecm
        - nudm-ueau
        - nudm-ee
        - nudm-pp
      sbi:
        scheme: http
        registerIPv4: udm.free5gc.svc.cluster.local
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          pem: cert/udm.pem
          key: cert/udm.key
      nrfUri: http://nrf.free5gc.svc.cluster.local:8000

      SuciProfile:
        - ProtectionScheme: 1
          PrivateKey: c53c22208b61860b06c62e5406a7b330c2b577aa5558981510d128247d38bd1d
          PublicKey: 5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650
        - ProtectionScheme: 2
          PrivateKey: F1AB1074477EBCC7F554EA1C5FC368B1616730155E0041AC447D6301975FECDA
          PublicKey: 0472DA71976234CE833A6907425867B82E074D44EF907DFB4B3E21C1C2256EBCD15A7DED52FCBB097A4ED250E036C7B9C8C7004C4EEDC4F068CD7BF8D3F900E3B4

      metrics:
        enable: true
        scheme: http
        bindingIPv4: 0.0.0.0
        port: 9091
        namespace: free5gc

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-udm
  namespace: free5gc
  labels:
    epc-mode: udm
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: udm
  template:
    metadata:
      labels:
        epc-mode: udm
        app: free5gc-udm
        version: v4.2.3
    spec:
      hostname: udm-pod
      nodeSelector:
        # Replace with the hostname of the core node (docs/02, section 2.4).
        kubernetes.io/hostname: CHANGE-ME-core-node
      containers:
        - name: udm
          image: free5gc/udm:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["./udm", "-c", "/etc/free5gc/udmConfig.yaml"]
          env:
            - name: GIN_MODE
              value: release
          ports:
            - name: http2-8000
              protocol: TCP
              containerPort: 8000
            - name: metrics-9091
              protocol: TCP
              containerPort: 9091
          volumeMounts:
            - name: config-volume
              mountPath: /etc/free5gc
      volumes:
        - name: config-volume
          configMap:
            name: udm-config
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: udm
  namespace: free5gc
  labels:
    app: free5gc-udm
spec:
  selector:
    epc-mode: udm
    app: free5gc-udm
  ports:
    - name: http2-8000
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: metrics-9091
      protocol: TCP
      port: 9091
      targetPort: 9091
