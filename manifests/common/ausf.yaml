# AUSF: authentication. See docs/03-control-plane.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ausf-config
  namespace: free5gc
data:
  ausfConfig.yaml: |
    info:
      version: 1.0.3
      description: AUSF initial local configuration

    configuration:
      sbi:
        scheme: http
        registerIPv4: ausf.free5gc.svc.cluster.local
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          pem: cert/ausf.pem
          key: cert/ausf.key
      serviceNameList:
        - nausf-auth
      nrfUri: http://nrf.free5gc.svc.cluster.local:8000
      plmnSupportList:
        - mcc: 208
          mnc: 93
        - mcc: 123
          mnc: 45
      groupId: ausfGroup001
      eapAkaSupiImsiPrefix: false

      metrics:
        enable: true
        scheme: http
        bindingIPv4: 0.0.0.0
        port: 9091
        namespace: free5gc

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-ausf
  namespace: free5gc
  labels:
    epc-mode: ausf
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: ausf
  template:
    metadata:
      labels:
        epc-mode: ausf
        app: free5gc-ausf
        version: v4.2.3
    spec:
      hostname: ausf-pod
      nodeSelector:
        # Replace with the hostname of the core node (docs/02, section 2.4).
        kubernetes.io/hostname: CHANGE-ME-core-node
      containers:
        - name: ausf
          image: free5gc/ausf:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["./ausf", "-c", "/etc/free5gc/ausfConfig.yaml"]
          env:
            - name: GIN_MODE
              value: release
          ports:
            - name: http2-8000
              protocol: TCP
              containerPort: 8000
            - name: metrics-9091
              protocol: TCP
              containerPort: 9091
          volumeMounts:
            - name: config-volume
              mountPath: /etc/free5gc
      volumes:
        - name: config-volume
          configMap:
            name: ausf-config
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: ausf
  namespace: free5gc
  labels:
    app: free5gc-ausf
spec:
  selector:
    epc-mode: ausf
    app: free5gc-ausf
  ports:
    - name: http2-8000
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: metrics-9091
      protocol: TCP
      port: 9091
      targetPort: 9091
