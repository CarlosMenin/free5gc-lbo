# Web console: creates the 'admin' tenant on first boot, which the subscriber
# provisioning script depends on (docs/07-ran-and-subscribers.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: webui-config
  namespace: free5gc
data:
  webuiConfig.yaml: |
    info:
      # v4.2.3 requires version 1.0.3 and the nrfUri, webServer and
      # billingServer blocks below.
      version: 1.0.3
      description: WebUI initial local configuration

    configuration:
      mongodb:
        name: free5gc
        url: mongodb://mongo:27017
      nrfUri: http://nrf.free5gc.svc.cluster.local:8000
      webServer:
        scheme: http
        ipv4Address: 0.0.0.0
        port: 5000
      billingServer:
        # Must be true: 'enable: false' fails the configuration validation.
        enable: true
        hostIPv4: 127.0.0.1
        listenPort: 2121
        portRange:
          start: 2123
          end: 2130
        basePath: /tmp/webconsole
        port: 2122
        cert:
          pem: cert/chf.pem
          key: cert/chf.key

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-webui
  namespace: free5gc
  labels:
    epc-mode: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: webui
  template:
    metadata:
      labels:
        epc-mode: webui
        app: free5gc-webui
        version: v4.2.3
    spec:
      hostname: webui-pod
      nodeSelector:
        # Replace with the hostname of the core node (docs/02, section 2.4).
        kubernetes.io/hostname: CHANGE-ME-core-node
      containers:
        - name: webui
          image: free5gc/webui:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["./webui", "-c", "/etc/free5gc/webuiConfig.yaml"]
          env:
            - name: GIN_MODE
              value: release
          ports:
            - name: http2-5000
              protocol: TCP
              containerPort: 5000
          volumeMounts:
            - name: config-volume
              mountPath: /etc/free5gc
      volumes:
        - name: config-volume
          configMap:
            name: webui-config
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: free5gc
  labels:
    app: free5gc-webui
spec:
  type: NodePort
  selector:
    epc-mode: webui
    app: free5gc-webui
  ports:
    - name: http2-5000
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500
