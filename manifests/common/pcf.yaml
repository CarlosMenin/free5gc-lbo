# PCF: policy control. Turns the Traffic Influence data stored in the UDR into
# PCC rules delivered to the SMF (docs/06-traffic-influence.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pcf-config
  namespace: free5gc
data:
  pcfConfig.yaml: |
    info:
      version: 1.0.2
      description: PCF initial local configuration
    configuration:
      pcfName: PCF
      sbi:
        scheme: http
        registerIPv4: pcf.free5gc.svc.cluster.local
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          pem: cert/pcf.pem
          key: cert/pcf.key
      timeFormat: 2019-01-02 15:04:05
      defaultBdtRefId: BdtPolicyId-
      nrfUri: http://nrf.free5gc.svc.cluster.local:8000
      serviceList:
        - serviceName: npcf-am-policy-control
        - serviceName: npcf-smpolicycontrol
          suppFeat: 3fff
        - serviceName: npcf-bdtpolicycontrol
        - serviceName: npcf-policyauthorization
          suppFeat: 3
        - serviceName: npcf-eventexposure
        - serviceName: npcf-ue-policy-control
        - serviceName: npcf-callback
      mongodb:
        name: free5gc
        url: mongodb://mongo:27017
      locality: area1

      metrics:
        enable: true
        scheme: http
        bindingIPv4: 0.0.0.0
        port: 9091
        namespace: free5gc

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-pcf
  namespace: free5gc
  labels:
    epc-mode: pcf
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: pcf
  template:
    metadata:
      labels:
        epc-mode: pcf
        app: free5gc-pcf
        version: v4.2.3
    spec:
      hostname: pcf-pod
      nodeSelector:
        # Replace with the hostname of the core node (docs/02, section 2.4).
        kubernetes.io/hostname: CHANGE-ME-core-node
      containers:
        - name: pcf
          image: free5gc/pcf:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["./pcf", "-c", "/etc/free5gc/pcfConfig.yaml"]
          env:
            - name: GIN_MODE
              value: release
          ports:
            - name: http2-8000
              protocol: TCP
              containerPort: 8000
            - name: metrics-9091
              protocol: TCP
              containerPort: 9091
          volumeMounts:
            - name: config-volume
              mountPath: /etc/free5gc
      volumes:
        - name: config-volume
          configMap:
            name: pcf-config
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: pcf
  namespace: free5gc
  labels:
    app: free5gc-pcf
spec:
  selector:
    epc-mode: pcf
    app: free5gc-pcf
  ports:
    - name: http2-8000
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: metrics-9091
      protocol: TCP
      port: 9091
      targetPort: 9091
